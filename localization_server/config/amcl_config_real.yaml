amcl:
  ros__parameters:

    use_sim_time: True

    # ------------------------------------------------------------------
    # Frames TF
    # ------------------------------------------------------------------

    global_frame_id: "map"
    odom_frame_id: "robot_odom"
    base_frame_id: "robot_base_footprint"
    tf_broadcast: true
    transform_tolerance: 1.0

    # ------------------------------------------------------------------
    # Laser Model Parameter
    # ------------------------------------------------------------------

    scan_topic: "scan"
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    max_beams: 60
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    sigma_hit: 0.2
    lambda_short: 0.1

    # ------------------------------------------------------------------
    # Movement Model
    # ------------------------------------------------------------------

    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # ------------------------------------------------------------------
    # Particule Cloud
    # ------------------------------------------------------------------

    min_particles: 200
    max_particles: 8000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    # ------------------------------------------------------------------
    # Update Trigger
    # ------------------------------------------------------------------

    update_min_d: 0.25
    update_min_a: 0.2
    save_pose_rate: 0.5
    gui_publish_rate: 10.0

    # ------------------------------------------------------------------
    # Initialisation
    # ------------------------------------------------------------------

    set_initial_pose: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0