planner_server:
  ros__parameters:

    use_sim_time: True

    expected_planner_frequency: 5.0

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      allow_unknown: true
      use_astar: false
      tolerance: 0.5

global_costmap:
  global_costmap:
    ros__parameters:

      use_sim_time: True

      global_frame: map
      robot_base_frame: robot_base_footprint

      update_frequency: 2.0
      publish_frequency: 1.0

      resolution: 0.05

      track_unknown_space: true

      # For the real robot, it could be adapted
      robot_radius: 0.30

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      filters: ["keepout_filter"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true

        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"

          marking: true
          clearing: true

          obstacle_min_range: 0.0
          obstacle_max_range: 8.0

          raytrace_min_range: 0.0
          raytrace_max_range: 10.0

          max_obstacle_height: 2.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        # L'inflation crée une marge de sécurité autour des obstacles.
        # Ces valeurs constituent un point de départ à régler avec
        # les dimensions réelles du RB1 et la largeur des passages.
        inflation_radius: 0.20
        cost_scaling_factor: 2.0

      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/costmap_filter_info"

      always_send_full_costmap: true